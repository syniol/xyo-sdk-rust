name: Regenerate Rust OpenAPI Client

on:
  repository_dispatch:
    types: [spec_tagged, spec_updated]
  workflow_dispatch:
    inputs:
      spec_tag:
        description: 'Tag or branch in xyo-financial/specs to generate from'
        required: false
        default: 'main'

jobs:
  regenerate:
    name: Generate OpenAPI Rust client
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout SDK repository
        uses: actions/checkout@v4

      - name: Checkout OpenAPI specification
        uses: actions/checkout@v4
        with:
          repository: xyo-financial/specs
          ref: ${{ github.event.client_payload.tag || inputs.spec_tag || 'main' }}
          path: specs

      - name: Set up Node.js (for openapi-generator-cli)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Rust client from OpenAPI spec
        run: |
          npx -y @openapitools/openapi-generator-cli generate \
            -i specs/openapi.yml \
            -g rust \
            -o openapi \
            --additional-properties=packageName=xyo-openapi-client,packageVersion=2.0.0 \
            --global-property apiTests=false,modelTests=false,apiDocs=false,modelDocs=false

          # Remove generator noise and scaffolding files
          rm -f openapi/git_push.sh \
                openapi/.travis.yml \
                openapi/README.md \
                openapi/.gitignore
          rm -rf openapi/docs \
                 openapi/.openapi-generator

          # Clean up specs checkout so it is not committed
          rm -rf specs

      - name: Build workspace to verify compilation
        run: |
          cargo check
          cargo test

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SDK_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(rust): regenerate OpenAPI client from spec ${{ github.event.client_payload.tag || inputs.spec_tag || 'latest' }}"
          title: "Automated SDK Update"
          body: "This PR automatically updates the generated Rust client based on OpenAPI spec ${{ github.event.client_payload.tag || inputs.spec_tag || 'latest' }}."
          branch: "chore/auto-update-sdk"
          delete-branch: true
