[package]
name = "xyo-openapi-client"
version = "2.1.0"
authors = ["OpenAPI Generator team and contributors"]
description = "RESTful API for enriching financial transactions."
# Override this license by providing a License Object in the OpenAPI.
license = "Unlicense"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "1.0.143"
serde_repr = "^0.1"
url = "2.5"
idna = "0.5"
indexmap = "2.2"
getrandom = "0.2"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = ["rustls-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]

[lints.rust]
warnings = "allow"
[lints.clippy]
all = "allow"


