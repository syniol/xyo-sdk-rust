workspace = { members = ["openapi"], exclude = ["example"] }

[package]
name = "xyo-sdk"
description = "XYO Financial Official SDK for Rust"
version = "2.0.0"
edition = "2021"
authors = [
    "Hadi Tajallaei <hadi@syniol.com>"
]
repository = "https://github.com/xyo-financial/sdk-rust"
homepage = "https://xyo.financial"
categories = ["finance"]
license = "BSD-3-Clause"
readme = "README.md"
exclude = [
    ".idea",
    ".gitignore",
    ".github",
    "Dockerfile",
    "LICENSE",
    "Makefile",
    "example/*",
    "docs/*"
]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
openapi-client = { version = "2.0.0", path = "openapi" }
tokio = { version = "=1.38.0", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
wiremock = "0.6"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }


